<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img">
<title>Wiring between the Speeduino v0.4.4d and the bridge PCB</title>
<desc>Speeduino D14 (TX3) goes to bridge terminal A1 (RX), through a 1k resistor to ESP32-C3 GPIO4 with a 2k resistor to ground. Bridge terminal A2 (TX) goes to GPIO5 and on to Speeduino D15 (RX3). Speeduino J6 GND goes to bridge B1 (12V minus). A fused switched 12 V feed goes to B2 (12V plus), through the buck converter to the C3 5V pin.</desc>
<style>
text{font-family:Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#F1EFE8;stroke:#888780}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="470" fill="#fff"/>

<rect x="305" y="40" width="360" height="372" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="320" y="62">Bridge board</text>

<g class="c-teal">
<rect x="30" y="70" width="200" height="250" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="90" text-anchor="middle">Speeduino v0.4.4d</text>
<text class="th" x="222" y="110" text-anchor="end" dominant-baseline="central">D14 · TX3</text>
<text class="th" x="222" y="190" text-anchor="end" dominant-baseline="central">D15 · RX3</text>
<text class="th" x="222" y="292" text-anchor="end" dominant-baseline="central">J6 · GND</text>
</g>
<circle cx="230" cy="110" r="3" fill="#2C2C2A"/>
<circle cx="230" cy="190" r="3" fill="#2C2C2A"/>
<circle cx="230" cy="292" r="3" fill="#2C2C2A"/>

<g class="c-gray">
<rect x="30" y="340" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="360" text-anchor="middle" dominant-baseline="central">12 V source</text>
<text class="ts" x="130" y="379" text-anchor="middle" dominant-baseline="central">Switched, 1 A fuse</text>
</g>
<circle cx="230" cy="368" r="3" fill="#2C2C2A"/>

<path d="M234 110H316" fill="none" style="stroke:#1D9E75;stroke-width:2" marker-end="url(#arrow)"/>
<text class="ts" x="275" y="98" text-anchor="middle">5 V logic</text>
<path d="M316 190H234" fill="none" style="stroke:#BA7517;stroke-width:2" marker-end="url(#arrow)"/>
<text class="ts" x="275" y="178" text-anchor="middle">3.3 V logic</text>
<path d="M234 292H316" fill="none" style="stroke:#888780;stroke-width:2"/>
<path d="M234 368H316" fill="none" style="stroke:#E24B4A;stroke-width:2"/>
<text class="ts" x="275" y="356" text-anchor="middle">12 V</text>

<rect class="box" x="320" y="88" width="80" height="124" rx="4" stroke-width="0.5"/>
<line x1="320" y1="150" x2="400" y2="150" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="360" y="110" text-anchor="middle" dominant-baseline="central">A1 · RX</text>
<text class="th" x="360" y="190" text-anchor="middle" dominant-baseline="central">A2 · TX</text>

<rect class="box" x="320" y="270" width="80" height="120" rx="4" stroke-width="0.5"/>
<line x1="320" y1="330" x2="400" y2="330" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="360" y="292" text-anchor="middle" dominant-baseline="central">B1 · 12V−</text>
<text class="th" x="360" y="368" text-anchor="middle" dominant-baseline="central">B2 · 12V+</text>

<path d="M400 110H425" fill="none" style="stroke:#1D9E75;stroke-width:2"/>
<rect class="box" x="425" y="100" width="60" height="20" rx="4" stroke-width="0.5"/>
<text class="ts" x="455" y="110" text-anchor="middle" dominant-baseline="central">R1 · 1k</text>
<path d="M485 110H565" fill="none" style="stroke:#1D9E75;stroke-width:2"/>
<circle cx="510" cy="110" r="3" fill="#1D9E75"/>
<path d="M510 110V124" fill="none" style="stroke:#1D9E75;stroke-width:2"/>
<rect class="box" x="482" y="124" width="56" height="22" rx="4" stroke-width="0.5"/>
<text class="ts" x="510" y="135" text-anchor="middle" dominant-baseline="central">R2 · 2k</text>
<path d="M510 146V160" fill="none" style="stroke:#888780;stroke-width:2"/>
<line x1="498" y1="160" x2="522" y2="160" stroke="#888780" stroke-width="2"/>
<line x1="503" y1="165" x2="517" y2="165" stroke="#888780" stroke-width="2"/>
<line x1="508" y1="170" x2="512" y2="170" stroke="#888780" stroke-width="2"/>

<path d="M400 190H565" fill="none" style="stroke:#BA7517;stroke-width:2"/>

<g class="c-purple">
<rect x="565" y="68" width="90" height="262" rx="8" stroke-width="0.5"/>
<text class="th" x="610" y="86" text-anchor="middle" dominant-baseline="central">ESP32-C3</text>
<text class="ts" x="578" y="110" dominant-baseline="central">GPIO4</text>
<text class="ts" x="578" y="190" dominant-baseline="central">GPIO5</text>
<text class="ts" x="578" y="250" dominant-baseline="central">GND</text>
<text class="ts" x="578" y="290" dominant-baseline="central">5V</text>
</g>
<circle cx="565" cy="110" r="3" fill="#2C2C2A"/>
<circle cx="565" cy="190" r="3" fill="#2C2C2A"/>
<circle cx="565" cy="250" r="3" fill="#2C2C2A"/>
<circle cx="565" cy="290" r="3" fill="#2C2C2A"/>

<path d="M400 292H420V315H440" fill="none" style="stroke:#888780;stroke-width:2"/>
<path d="M400 368H420V345H440" fill="none" style="stroke:#E24B4A;stroke-width:2"/>
<rect class="box" x="440" y="300" width="80" height="60" rx="6" stroke-width="0.5"/>
<text class="th" x="480" y="322" text-anchor="middle" dominant-baseline="central">Buck</text>
<text class="ts" x="480" y="341" text-anchor="middle" dominant-baseline="central">12 V to 5 V</text>
<path d="M520 315H535V250H565" fill="none" style="stroke:#888780;stroke-width:2"/>
<path d="M520 345H545V290H565" fill="none" style="stroke:#E24B4A;stroke-width:2"/>

<line x1="40" y1="436" x2="64" y2="436" stroke="#1D9E75" stroke-width="2"/>
<text class="ts" x="72" y="436" dominant-baseline="central">Speeduino TX3</text>
<line x1="190" y1="436" x2="214" y2="436" stroke="#BA7517" stroke-width="2"/>
<text class="ts" x="222" y="436" dominant-baseline="central">Bridge TX</text>
<line x1="318" y1="436" x2="342" y2="436" stroke="#E24B4A" stroke-width="2"/>
<text class="ts" x="350" y="436" dominant-baseline="central">12 V / 5 V</text>
<line x1="450" y1="436" x2="474" y2="436" stroke="#888780" stroke-width="2"/>
<text class="ts" x="482" y="436" dominant-baseline="central">Ground (one net)</text>
</svg>

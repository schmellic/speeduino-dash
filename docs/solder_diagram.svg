<text x="500" y="672" font-size="13" text-anchor="middle" fill="#444">Shared (go to both headers): 3V3, GND, GPIO18 clock, GPIO23 data, GPIO21 DC. Own wires: GPIO5, 22, 25 tach; GPIO4, 27, 26 info.</text>
<text x="500" y="692" font-size="13" text-anchor="middle" fill="#444">Colours match the signal: red 3V3, black GND, blue clock, green data, purple DC, orange CS, yellow RST, teal backlight.</text>

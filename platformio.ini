[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bench test: no ECU needed, sends fake data
[env:bridge_sim]
build_src_filter = +<bridge/>
build_flags = -DSIMULATE=1

; In the car: reads the Speeduino on Serial2 (RX=16, TX=17)
[env:bridge_live]
build_src_filter = +<bridge/>
build_flags = -DSIMULATE=0

; Dash node: receives the bridge broadcast (UI to be added once screens are chosen)
[env:display_rx]
build_src_filter = +<display/>

; Bridge on an ESP32-C3 (Serial1: RX=GPIO4, TX=GPIO5)
[env:bridge_c3_sim]
board = esp32-c3-devkitm-1
build_src_filter = +<bridge/>
build_flags = -DSIMULATE=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:bridge_c3_live]
board = esp32-c3-devkitm-1
build_src_filter = +<bridge/>
build_flags = -DSIMULATE=0 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Dash node (classic ESP32): GC9B72 round tach + ILI9341 info screen
[env:dash]
build_src_filter = +<dash/>
lib_deps =
  moononournation/GFX Library for Arduino
  https://github.com/MaliosDark/Arduino_GC9B72.git
  olikraus/U8g2
build_flags = -DSIM_LOCAL=0

; Same, but generates fake data locally (no bridge needed)
[env:dash_sim]
build_src_filter = +<dash/>
lib_deps =
  moononournation/GFX Library for Arduino
  https://github.com/MaliosDark/Arduino_GC9B72.git
  olikraus/U8g2
build_flags = -DSIM_LOCAL=1 -DINFO_SCREEN=0

; Bring-up for the round tach alone: solid colour cycle, same pins as the dash
[env:tach_test]
build_src_filter = +<tach_test/>
lib_deps =
  moononournation/GFX Library for Arduino
  https://github.com/MaliosDark/Arduino_GC9B72.git

; Wiring check: holds each tach pin HIGH in turn so a multimeter can confirm the wire
[env:pin_test]
build_src_filter = +<pin_test/>
